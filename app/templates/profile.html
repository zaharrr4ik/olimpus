{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <div>
        <h2>{{ user.first_name }} {{ user.last_name }}</h2>
        <div style="color:var(--text-muted);font-size:13px;margin-top:4px;">Личный кабинет</div>
    </div>
    <span class="badge">{{ user.role }}</span>
</div>

<div class="profile-grid">
    <div class="profile-item">
        <div class="label">Имя</div>
        <div class="value">{{ user.first_name }}</div>
    </div>
    <div class="profile-item">
        <div class="label">Фамилия</div>
        <div class="value">{{ user.last_name }}</div>
    </div>
    <div class="profile-item">
        <div class="label">Логин</div>
        <div class="value">{{ user.username }}</div>
    </div>
    <div class="profile-item">
        <div class="label">Роль</div>
        <div class="value"><span class="badge">{{ user.role }}</span></div>
    </div>
</div>

<div class="actions">
    <a href="{{ url_for('user.upload') }}" class="btn">Загрузить тестовый набор</a>
    <a href="{{ url_for('user.analytics') }}" class="btn btn-ghost">Перейти к аналитике</a>
</div>
{% endblock %}
